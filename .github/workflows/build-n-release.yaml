# Triggered by:
#   - push to main                  → build + deploy docs
#   - push of any tag               → build + deploy docs
#   - push of annotated tag         → build + deploy docs + draft GitHub release
#
# Tag conventions:
#   annotated:   vX.Y.Z              (semver, triggers release)
#   other:       vX.Y.Z+text         (semver+text, semver must be annotated tag)
#
name: Build and Release

on:
   push:
      branches:
         - "main"
      tags:
         - "v*"

permissions:
   contents: write

concurrency:
   group: build-deploy-${{ github.ref }}
   cancel-in-progress: false

# TODO: remove planned after 2nd June 2026 (v24 will be default)
env:
   FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
   check:
      runs-on: ubuntu-latest
      outputs:
         is-release: ${{ steps.detect.outputs.is-release }}
      steps:
         - uses: actions/checkout@v6
           with:
              fetch-depth: 1
              fetch-tags: true

         - id: detect
           shell: bash
           run: |
              TYPE=$(git for-each-ref "refs/tags/${{ github.ref_name }}" \
                --format='%(objecttype)')
              if [ "$TYPE" = "tag" ]; then
                echo "PUSHED REF: annotated tag → release"
                echo "is-release=true" >> "$GITHUB_OUTPUT"
                  else
                echo "PUSHED REF: branch or lightweight tag → build only"
                echo "is-release=false" >> "$GITHUB_OUTPUT"
              fi

   build:
      needs: check
      uses: ./.github/workflows/_build-core.yaml
      with:
         build-release-artifacts: true
         check-private-repo: true

   release:
      runs-on: ubuntu-latest
      needs: [check, build]
      if: needs.check.outputs.is-release == 'true'
      env:
         GH_TOKEN: ${{ github.token }}
         RELEASE_TAG: ${{ github.ref_name }}
         RELEASE_DIR: ${{ github.workspace }}/release

      steps:
         - name: Checkout
           uses: actions/checkout@v6
           with:
              fetch-depth: 0

         - name: Download build artifact
           uses: actions/download-artifact@v8
           with:
              name: release
              path: ${{ env.RELEASE_DIR }}/

         - name: Create release assets
           shell: bash
           run: |

              # plugins of highlight.js and discourse
              mkdir "${{ env.RELEASE_DIR }}/javascripts"
              for lang in go-html go-text hugo-html hugo-text; do
                echo "##### ${{ env.RELEASE_DIR }}/discourse/${lang}"
                (cd "${{ env.RELEASE_DIR }}/discourse/${lang}" && zip -r "../discourse-${lang}.zip" .)
                cp ${{ env.RELEASE_DIR }}/highlightjs/${lang}/dist/${lang}.min.js ${{ env.RELEASE_DIR }}/javascripts/${lang}.min.js
                cp ${{ env.RELEASE_DIR }}/highlightjs/${lang}/dist/${lang}.es.min.js ${{ env.RELEASE_DIR }}/javascripts/${lang}.es.min.js
              done
              cp ${{ env.RELEASE_DIR }}/highlight-go.min.js ${{ env.RELEASE_DIR }}/javascripts/highlight-go.min.js
              cp ${{ env.RELEASE_DIR }}/highlight-hugo.min.js ${{ env.RELEASE_DIR }}/javascripts/highlight-hugo.min.js
              echo "#### ${{ env.RELEASE_DIR }}"
              tree ${{ env.RELEASE_DIR }}

              echo "##### copy asset discourse"
              (cd "${{ env.RELEASE_DIR }}/discourse" && zip "${{ github.workspace }}/highlightjs-hugo-discourse.zip" discourse-go-html.zip discourse-go-text.zip discourse-hugo-html.zip discourse-hugo-text.zip)

              echo "##### copy asset highlightjs"
              (cd "${{ env.RELEASE_DIR }}/highlightjs" && zip -r "${{ github.workspace }}/highlightjs-hugo-extra-src.zip" .)

              echo "#### copy asset javascripts"
              tree ${{ env.RELEASE_DIR }}/javascripts
              (cd ${{ env.RELEASE_DIR }}/javascripts && zip "${{ github.workspace }}/highlightjs-hugo-js-modules.zip" *.js)
         - name: Generate checksums
           shell: bash
           working-directory: ${{ github.workspace }}
           run: |
              sha256sum \
                highlightjs-hugo-discourse.zip \
                highlightjs-hugo-extra-src.zip \
                highlightjs-hugo-js-modules.zip \
                > checksums.txt

              echo "### checksums.txt"
              cat checksums.txt

         - name: Determine release refs
           id: refs
           shell: bash
           run: |
              PREV_TAG=$(gh release list --limit 10 --json tagName,isDraft \
                | jq -r '.[] | select(.isDraft == false) | select(.tagName != "${{ env.RELEASE_TAG }}") | .tagName' \
                | head -1)

              echo "prev-tag=${PREV_TAG}" >> "$GITHUB_OUTPUT"
              echo "head-tag=${{ env.RELEASE_TAG }}" >> "$GITHUB_OUTPUT"

              if [ -z "$PREV_TAG" ]; then
                echo "range=${{ env.RELEASE_TAG }}" >> "$GITHUB_OUTPUT"
              else
                echo "range=${PREV_TAG}..${{ env.RELEASE_TAG }}" >> "$GITHUB_OUTPUT"
              fi

         - name: Generate commit log
           id: commitlog
           shell: bash
           env:
             RANGE: ${{ steps.refs.outputs.range }}
           run: |
             LOG=$(git log "$RANGE" \
               --pretty=format:"- [\`%h\`](${{ github.server_url }}/${{ github.repository }}/commit/%H) %ad — %s" \
               --date=format:"%Y-%m-%d" \
               --no-merges)
             {
               echo 'commitlog<<EOF'
               echo "$LOG"
               echo 'EOF'
             } >> "$GITHUB_OUTPUT"

         - name: Generate What's New
           id: whats-new
           uses: actions/ai-inference@v3
           with:
             model: gpt-4.1
             system-prompt: |
               You are generating release notes for a software project.

               Summarize the supplied commit messages into a concise,
               human-readable "What's New" section.

               Rules:
               - Return ONLY Markdown bullet points.
               - Do not return a heading.
               - Combine multiple commits that belong to the same feature or change.
               - A series of implementation commits should normally become one bullet.
               - Describe the user-visible result, not the individual commits.
               - Ignore purely internal refactoring unless it has a meaningful
               user-visible impact.
               - Do not mention commit hashes or dates.
               - Do not invent functionality that isn't represented by the commits.
               - Keep each bullet concise, preferably one sentence.
               - Do not produce a bullet for every commit.

               Commit messages:
               ${{ steps.commitlog.outputs.commitlog }}
           env:
              COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
         # KEEP it in here in case we switch to using PRs
         # - name: Generate What's New
         #   id: whats-new
         #   uses: github/copilot-release-notes@main
         #   with:
         #     base-ref: ${{ steps.refs.outputs.prev-tag }}
         #     head-ref: ${{ steps.refs.outputs.head-tag }}
         #   env:
         #     COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}

         # hugen/_hugodocs is committed, so the delta between two releases is already in
         # git history - no rebuild needed. Goes in front of the commit list.
         - name: Generate keyword changes
           id: keywords
           shell: pwsh
           env:
             PREV_TAG: ${{ steps.refs.outputs.prev-tag }}
           run: |
             $prevDir = Join-Path '${{ github.workspace }}' 'work/prev-keywords'
             [void](New-Item -ItemType Directory -Force -Path $prevDir)

             $baselineRef = $env:PREV_TAG
             if ($baselineRef) {
               $json = git show "${baselineRef}:hugen/_hugodocs/functions.json" 2>$null
               $gitShowExitCode = $LASTEXITCODE

               $global:LASTEXITCODE = 0

               if ($gitShowExitCode -ne 0 -or -not $json) {
                 # tag predates the committed extraction -- fall back to the oldest commit
                 # that has it, so the section still shows real content instead of nothing
                 Write-Host "no hugen/_hugodocs/functions.json at $baselineRef - falling back to oldest tracked commit"
                 $baselineRef = (git log --format=%H -- hugen/_hugodocs/functions.json | Select-Object -Last 1)
                 if ($baselineRef) {
                   $json = git show "${baselineRef}:hugen/_hugodocs/functions.json" 2>$null
                   $gitShowExitCode = $LASTEXITCODE
                   $global:LASTEXITCODE = 0
                 }
               }

               if ($gitShowExitCode -eq 0 -and $json) {
                 $json | Set-Content -Encoding utf8 -Path (Join-Path $prevDir 'functions.json')
               }
             }

             $heading = if ($env:PREV_TAG) {
               "## Keyword changes since $env:PREV_TAG"
             } else {
               '## Keyword changes'
             }

             $diff = ./build/keywords-diff.ps1 `
               -OldDir $prevDir `
               -NewDir hugen/_hugodocs `
               -Format Markdown `
               -Heading $heading `
               -OutFile keywords-section.md

             # a missing baseline (tag predates the committed extraction) is not the same as
             # "nothing changed" - say so instead of silently dropping the section
             $includeSection = $diff.Changed -or -not $diff.HasBaseline
             if ($includeSection) {
               "include-section=true" >> $env:GITHUB_OUTPUT
             } else {
               "include-section=false" >> $env:GITHUB_OUTPUT
               Write-Host 'no keyword changes - section omitted'
             }

         - name: Assemble release notes
           shell: pwsh
           env:
             INCLUDE_KEYWORDS_SECTION: ${{ steps.keywords.outputs.include-section }}
             WHATS_NEW: ${{ steps.whats-new.outputs.release-notes }}
             COMMITLOG: ${{ steps.commitlog.outputs.commitlog }}
           run: |
              $parts = @()
              if ($env:INCLUDE_KEYWORDS_SECTION -eq 'true') {
                 $parts += (Get-Content -Raw keywords-section.md).TrimEnd()
              }
              $parts += $env:WHATS_NEW.TrimEnd()
              $parts += "## Full Changelog`n`n$($env:COMMITLOG.TrimEnd())"
              Set-Content -Encoding utf8 -Path release-body.md -Value (($parts -join "`n`n") + "`n")
              Write-Host '### release-body.md'
              Get-Content release-body.md

         - name: Delete existing draft releases
           shell: bash
           run: |
              gh release list --limit 50 --json tagName,isDraft \
                | jq -r '.[] | select(.isDraft == true) | .tagName' \
                | xargs -r -I{} gh release delete {} --yes

         - name: Create GitHub Release
           uses: softprops/action-gh-release@v3
           with:
              tag_name: ${{ env.RELEASE_TAG }}
              name: ${{ env.RELEASE_TAG }}
              draft: true
              fail_on_unmatched_files: true
              body_path: release-body.md
              files: |
                 highlightjs-hugo-discourse.zip
                 highlightjs-hugo-extra-src.zip
                 highlightjs-hugo-js-modules.zip
                 checksums.txt

   docs:
      if: ${{ !github.event.repository.private }}
      runs-on: ubuntu-latest
      needs: [check, build]
      environment:
         name: github-pages
         url: ${{ steps.deploy.outputs.page_url }}
      permissions:
         contents: write
         pages: write
         id-token: write
      concurrency:
         group: pages
         cancel-in-progress: false

      steps:
         - name: Checkout
           uses: actions/checkout@v6
           with:
              fetch-depth: 1

         - name: Deploy to GitHub Pages
           id: deploy
           uses: ./.github/actions/deploy-pages-unique
           with:
              artifact_id: ${{ needs.build.outputs.pages_artifact_id }}
