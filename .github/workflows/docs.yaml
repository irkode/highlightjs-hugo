# Triggered by:
#   - workflow_dispatch (manual)
#   - a GitHub release being published (re-publishes docs against the released tag)
#
name: Publish Documentation

on:
   workflow_dispatch:
   release:
      types: [published]

permissions:
   contents: read

concurrency:
   group: publish-docs-${{ github.ref }}
   cancel-in-progress: false

jobs:
   build:
      uses: ./.github/workflows/_build-core.yaml
      with:
         build-release-artifacts: false
         check-private-repo: false

   docs:
      runs-on: ubuntu-latest
      needs: [build]
      environment:
         name: github-pages
         url: ${{ steps.deploy.outputs.page_url }}
      permissions:
         contents: write
         pages: write
         id-token: write
      concurrency:
         group: pages
         cancel-in-progress: false

      steps:
         - name: Checkout
           uses: actions/checkout@v6
           with:
              fetch-depth: 1

         - name: Deploy to GitHub Pages
           id: deploy
           uses: ./.github/actions/deploy-pages-unique
           with:
              artifact_id: ${{ needs.build.outputs.pages_artifact_id }}
