# Words the docs do not give us as such: go-template constructs we want as
# builtins, plus the literals. Scope assignment is a grammar decision, so it
# belongs here next to `patterns` and `generate`.
fixed:
  BUILTINS:
    - and
    - len
    - not
    - or
    - urlquery
  LITERALS:
    - "false"
    - nil
    - "true"

patterns:
  KEYWORDS_PIPELINE:
    - block
    - define
    - else\s+with
    - else\s+if
    - range
    - return
    - template
    - try
    - with
    - if
  KEYWORDS_STANDALONE:
    - break
    - continue
    - else
    - end

generate:
  LITERALS: ['kw']
  BUILTINS: ['kw']
  FUNCTIONS: ['kw', 're']
  KEYWORDS:  []
