{{- /* human-readable dump for inspection only -- no effect on keywords.js */ -}}
{{- $tpl := templates.Current.Name -}}
{{- $pagePath := .Path -}}
{{- $idx := math.Counter -}}
{{- $lang := .Params.keywords -}}
{{- warnf "[%04d][ %-20s ] : %s :: %s" $idx $tpl $pagePath $lang -}}
{{- $keywords := partialCached "build-scopes.html" $lang $lang -}}
{{- $dataKeywords := index hugo.Data.keywords $lang -}}

{{- /* BUILTINS: documented functions with their aliases, plus the fixed seeds */ -}}
{{- $builtins := dict -}}
{{- if eq $lang "hugo" -}}
   {{- range $name, $entry := hugo.Data.hugodocs.functions -}}
      {{- if ne $entry.section "go-template" -}}
         {{- /* empty list via `after 1` -- a bare `slice` makes Remarshal emit a bogus YAML anchor */ -}}
         {{- $value := after 1 (slice $name) -}}
         {{- if gt (len $entry.aliases) 0 -}}
            {{- $value = $entry.aliases -}}
         {{- end -}}
         {{- $builtins = merge $builtins (dict $name $value) -}}
      {{- end -}}
   {{- end -}}
{{- end -}}
{{- range $word := $dataKeywords.fixed.BUILTINS -}}
   {{- if not (isset $builtins $word) -}}
      {{- $builtins = merge $builtins (dict $word (after 1 (slice $word))) -}}
   {{- end -}}
{{- end -}}

{{- /* --- KEYWORDS: patterns.KEYWORDS_PIPELINE + KEYWORDS_STANDALONE, "\s+" -> " ", sorted --- */ -}}
{{- $patterns := index $dataKeywords "patterns" -}}
{{- $rawWords := (index $patterns "KEYWORDS_PIPELINE") | append (index $patterns "KEYWORDS_STANDALONE") -}}
{{- $kwWords := slice -}}
{{- range $w := $rawWords -}}
   {{- $kwWords = $kwWords | append (replace $w `\s+` " ") -}}
{{- end -}}

{{- /* --- assemble output: exactly 3 top-level keys --- */ -}}
{{- $out := dict "KEYWORDS" (sort $kwWords) "BUILTINS" $builtins "LITERALS" (index $keywords "LITERALS") -}}
{{- transform.Remarshal "yaml" $out -}}
