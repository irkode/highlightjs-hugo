{{- /*
   Human-readable dump of the vocabulary, purely for inspection (e.g. to review
   which names were extracted and how they were classified). No effect on the
   keywords.js output generated by page.js.

   Unlike page.js this does not show the grammar scopes: it shows the shape the
   data actually has -- every function with its aliases, plus the keyword and
   literal lists.
   */
-}}
{{- $tpl := templates.Current.Name -}}
{{- $pagePath := .Path -}}
{{- $idx := math.Counter -}}
{{- $lang := .Params.keywords -}}
{{- warnf "[%04d][ %-20s ] : %s :: %s" $idx $tpl $pagePath $lang -}}
{{- $keywords := partialCached "build-scopes.html" $lang $lang -}}
{{- $dataKeywords := index hugo.Data.keywords $lang -}}

{{- /* --- BUILTINS: every documented function with its aliases, plus the fixed
   seed builtins. go-template constructs are excluded -- they are listed under
   KEYWORDS below. --- */ -}}
{{- $builtins := dict -}}
{{- if eq $lang "hugo" -}}
   {{- range $name, $entry := hugo.Data.hugodocs.functions -}}
      {{- if ne $entry.section "go-template" -}}
         {{- /* NOTE: bare `slice`/zero-length values are deliberately derived via
            `after 1 (slice X)` rather than a fresh empty `slice` -- Go gives every
            zero-capacity slice the same shared pointer, which transform.Remarshal's
            YAML encoder then mistakes for an anchor/alias cycle. Decoding `[]` from
            the JSON collapses that distinction again, so it has to be re-applied
            here after reading $entry.aliases. */ -}}
         {{- $value := after 1 (slice $name) -}}
         {{- if gt (len $entry.aliases) 0 -}}
            {{- $value = $entry.aliases -}}
         {{- end -}}
         {{- $builtins = merge $builtins (dict $name $value) -}}
      {{- end -}}
   {{- end -}}
{{- end -}}
{{- range $word := $dataKeywords.fixed.BUILTINS -}}
   {{- if not (isset $builtins $word) -}}
      {{- $builtins = merge $builtins (dict $word (after 1 (slice $word))) -}}
   {{- end -}}
{{- end -}}

{{- /* --- KEYWORDS: patterns.KEYWORDS_PIPELINE + KEYWORDS_STANDALONE, "\s+" -> " ", sorted --- */ -}}
{{- $patterns := index $dataKeywords "patterns" -}}
{{- $rawWords := (index $patterns "KEYWORDS_PIPELINE") | append (index $patterns "KEYWORDS_STANDALONE") -}}
{{- $kwWords := slice -}}
{{- range $w := $rawWords -}}
   {{- $kwWords = $kwWords | append (replace $w `\s+` " ") -}}
{{- end -}}

{{- /* --- assemble output: exactly 3 top-level keys --- */ -}}
{{- $out := dict "KEYWORDS" (sort $kwWords) "BUILTINS" $builtins "LITERALS" (index $keywords "LITERALS") -}}
{{- transform.Remarshal "yaml" $out -}}
